version: '3.8'

services:
  cardiosense-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardiosense-ai:latest
    container_name: cardiosense-ai-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=cardiosense-production-secret-key-2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
